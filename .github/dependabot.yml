version: 2
# NOTE: Go module CVEs are handled directly on main by the
# cve-autofix.yml workflow (no PR). Dependabot only covers GitHub Actions
# here, whose versions can't be safely patched by a go-get script.
updates:
  # GitHub Actions used by the workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions-all:
        patterns:
          - "*"
