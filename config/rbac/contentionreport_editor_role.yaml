# permissions for end users to edit contentionreports.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hilios-operator
    app.kubernetes.io/managed-by: kustomize
  name: contentionreport-editor-role
rules:
- apiGroups:
  - resilience.hilios.io
  resources:
  - contentionreports
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - resilience.hilios.io
  resources:
  - contentionreports/status
  verbs:
  - get
