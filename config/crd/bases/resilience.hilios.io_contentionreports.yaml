---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: contentionreports.resilience.hilios.io
spec:
  group: resilience.hilios.io
  names:
    categories:
    - hilios
    kind: ContentionReport
    listKind: ContentionReportList
    plural: contentionreports
    shortNames:
    - creport
    - creports
    singular: contentionreport
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.matchedTargets
      name: Targets
      type: integer
    - jsonPath: .status.findings[*].pod
      name: Findings
      priority: 1
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Observed")].status
      name: Observed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ContentionReport is the Schema for the contentionreports API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ContentionReportSpec defines the desired state of ContentionReport.
            properties:
              recommendOnly:
                default: true
                description: |-
                  RecommendOnly disables any active mitigation and limits the controller to
                  recording recommendations on findings.
                type: boolean
              schedule:
                description: Schedule is an optional cron expression for periodic
                  re-evaluation.
                type: string
              targetSelector:
                description: TargetSelector selects pods to evaluate.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              thresholds:
                description: Thresholds describe when a workload is considered to
                  be experiencing contention.
                properties:
                  cpuStealPercent:
                    default: 10
                    description: CPUStealPercent is the threshold for CPU steal time,
                      expressed as a percentage.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                  memoryPressureEvents:
                    default: 5
                    description: |-
                      MemoryPressureEvents is the threshold for the number of memory pressure events
                      observed within the evaluation window.
                    format: int32
                    minimum: 0
                    type: integer
                  throttlingPercent:
                    default: 15
                    description: |-
                      ThrottlingPercent is the threshold for the percentage of CPU time
                      spent throttled by the kernel.
                    format: int32
                    maximum: 100
                    minimum: 0
                    type: integer
                type: object
              windowMinutes:
                default: 15
                description: WindowMinutes is the look-back window used when evaluating
                  signals.
                format: int32
                minimum: 1
                type: integer
            required:
            - targetSelector
            type: object
          status:
            description: ContentionReportStatus defines the observed state of ContentionReport.
            properties:
              conditions:
                description: Conditions track the lifecycle of the report.
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource.\n---\nThis struct is intended for
                    direct use as an array at the field path .status.conditions.  For
                    example,\n\n\n\ttype FooStatus struct{\n\t    // Represents the
                    observations of a foo's current state.\n\t    // Known .status.conditions.type
                    are: \"Available\", \"Progressing\", and \"Degraded\"\n\t    //
                    +patchMergeKey=type\n\t    // +patchStrategy=merge\n\t    // +listType=map\n\t
                    \   // +listMapKey=type\n\t    Conditions []metav1.Condition `json:\"conditions,omitempty\"
                    patchStrategy:\"merge\" patchMergeKey:\"type\" protobuf:\"bytes,1,rep,name=conditions\"`\n\n\n\t
                    \   // other fields\n\t}"
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: |-
                        type of condition in CamelCase or in foo.example.com/CamelCase.
                        ---
                        Many .condition.type values are consistent across resources like Available, but because arbitrary conditions can be
                        useful (see .node.status.conditions), the ability to deconflict is important.
                        The regex it matches is (dns1123SubdomainFmt/)?(qualifiedNameFmt)
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              findings:
                description: Findings is the list of contention findings observed
                  during the most recent evaluation.
                items:
                  description: ContentionFinding records a single observation of contention.
                  properties:
                    node:
                      description: Node is the name of the node hosting the pod.
                      type: string
                    observedAt:
                      description: ObservedAt is when the signal was observed.
                      format: date-time
                      type: string
                    pod:
                      description: Pod is the name of the impacted pod.
                      type: string
                    reason:
                      description: Reason captures the contention signal (CPUSteal,
                        ThrottledCPU, MemoryPressure).
                      type: string
                    recommendation:
                      description: Recommendation is a short human readable mitigation
                        suggestion.
                      type: string
                    value:
                      description: Value is the observed numeric value associated
                        with the reason.
                      type: string
                  required:
                  - node
                  - observedAt
                  - pod
                  - reason
                  type: object
                type: array
              lastEvaluationTime:
                description: LastEvaluationTime is the most recent time the controller
                  evaluated the report.
                format: date-time
                type: string
              matchedTargets:
                description: MatchedTargets is the number of pods matched by the selector.
                format: int32
                type: integer
              message:
                description: Message is a human readable summary of the most recent
                  evaluation.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
