---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: resiliencepolicies.resilience.hilios.io
spec:
  group: resilience.hilios.io
  names:
    categories:
    - hilios
    kind: ResiliencePolicy
    listKind: ResiliencePolicyList
    plural: resiliencepolicies
    shortNames:
    - rpol
    - rpolicies
    singular: resiliencepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.matchedTargets
      name: Targets
      type: integer
    - jsonPath: .status.lastDriftCount
      name: Drift
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ResiliencePolicy is the Schema for the resiliencepolicies API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ResiliencePolicySpec defines the desired state of ResiliencePolicy.
            properties:
              mitigations:
                description: |-
                  Mitigations are the corrective actions this policy authorises.
                  An empty list disables all mitigations (observe-only mode).
                items:
                  description: |-
                    MitigationKind enumerates corrective actions a ResiliencePolicy may authorize.
                    Mitigations are intentionally narrow: HILIOS prefers to recommend safe
                    actions rather than execute destructive ones automatically.
                  enum:
                  - Isolate
                  - ApplyTopologySpread
                  - ScaleSafely
                  - PauseDisruption
                  type: string
                type: array
              schedule:
                description: |-
                  Schedule is an optional cron expression that drives periodic re-evaluation.
                  When omitted the policy is evaluated on every reconcile loop.
                type: string
              slo:
                description: SLO captures recovery service level objectives.
                properties:
                  maxReplicaSkew:
                    default: 1
                    description: MaxReplicaSkew is the maximum acceptable replica
                      imbalance across the target topology.
                    format: int32
                    minimum: 0
                    type: integer
                  recoveryTimeSeconds:
                    default: 900
                    description: |-
                      RecoveryTimeSeconds is the maximum acceptable time for a recovery action
                      to complete (recovery time objective).
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              suspend:
                default: false
                description: |-
                  Suspend prevents the controller from creating new RecoveryDrills or
                  applying mitigations. Existing resources are left untouched.
                type: boolean
              targetSelector:
                description: |-
                  TargetSelector selects the workloads (StatefulSets) governed by this policy.
                  An empty selector matches no workloads. Use the well-known label
                  hilios.io/enabled=true to opt into governance.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              verifications:
                description: Verifications are the checks this policy authorises.
                items:
                  description: |-
                    VerificationSpec describes a single verification check the policy authorises.
                    Multiple verifications of the same kind are allowed; the freshest successful
                    drill of any matching kind satisfies the freshness window.
                  properties:
                    freshnessSeconds:
                      default: 86400
                      description: |-
                        FreshnessSeconds is the maximum acceptable age of the last successful execution
                        before the policy reports Degraded.
                      format: int32
                      minimum: 60
                      type: integer
                    intervalSeconds:
                      default: 3600
                      description: IntervalSeconds is the minimum interval between
                        executions.
                      format: int32
                      minimum: 60
                      type: integer
                    kind:
                      description: Kind is the verification kind.
                      enum:
                      - RestoreVerification
                      - FailoverDrill
                      - ReplicaPlacement
                      type: string
                  required:
                  - kind
                  type: object
                minItems: 1
                type: array
            required:
            - targetSelector
            - verifications
            type: object
          status:
            description: ResiliencePolicyStatus defines the observed state of ResiliencePolicy.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations of the policy state.
                  Standard condition types: Ready, Validated, Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastDriftCount:
                description: LastDriftCount is the number of policy violations observed
                  in the last evaluation.
                format: int32
                type: integer
              lastEvaluationTime:
                description: LastEvaluationTime is the last time the controller evaluated
                  the policy.
                format: date-time
                type: string
              lastViolation:
                description: LastViolation summarises the most recent policy violation,
                  if any.
                type: string
              matchedTargets:
                description: MatchedTargets is the number of workloads currently matched
                  by the target selector.
                format: int32
                type: integer
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
