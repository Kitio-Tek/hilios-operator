---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: recoverydrills.resilience.hilios.io
spec:
  group: resilience.hilios.io
  names:
    categories:
    - hilios
    kind: RecoveryDrill
    listKind: RecoveryDrillList
    plural: recoverydrills
    shortNames:
    - rdrill
    - rdrills
    singular: recoverydrill
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.durationSeconds
      name: Duration
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RecoveryDrill is the Schema for the recoverydrills API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RecoveryDrillSpec defines the desired state of RecoveryDrill.
            properties:
              cleanup:
                default: true
                description: Cleanup controls whether verification artefacts are deleted
                  after the drill completes.
                type: boolean
              healthChecks:
                description: HealthChecks are probes evaluated against the restored
                  or failed-over workload.
                items:
                  description: |-
                    HealthCheck describes a probe executed against the restored workload.
                    The probe model is inspired by the Litmus Chaos probe schema (httpProbe,
                    k8sProbe, cmdProbe) so users familiar with chaos engineering pipelines can
                    reuse mental models. Unlike Litmus, HILIOS probes are read-only and never
                    inject failures.
                  properties:
                    command:
                      description: |-
                        Command is the shell command executed inside the probe runner pod
                        (only for type Cmd). Commands run in a busybox image without elevated
                        privileges and must complete within TimeoutSeconds.
                      type: string
                    expectedOutput:
                      description: |-
                        ExpectedOutput is a substring matched against the command's stdout
                        (only for type Cmd). When empty, exit code 0 is sufficient.
                      type: string
                    expectedStatusCode:
                      default: 200
                      description: ExpectedStatusCode is the HTTP status code that
                        indicates success.
                      format: int32
                      type: integer
                    name:
                      description: Name is a human readable identifier for the health
                        check.
                      type: string
                    podSelector:
                      description: PodSelector selects pods to probe (only for type
                        Pod).
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                    resource:
                      description: |-
                        Resource targets a Kubernetes object whose existence is verified
                        (only for type Kubernetes).
                      properties:
                        apiVersion:
                          description: APIVersion of the target object, for example
                            "apps/v1".
                          type: string
                        kind:
                          description: Kind of the target object, for example "StatefulSet".
                          type: string
                        name:
                          description: Name of the target object.
                          type: string
                        namespace:
                          description: Namespace of the target object.
                          type: string
                      required:
                      - apiVersion
                      - kind
                      - name
                      type: object
                    retryCount:
                      default: 0
                      description: |-
                        RetryCount is the number of times the probe is re-attempted on failure
                        before being marked failed.
                      format: int32
                      minimum: 0
                      type: integer
                    timeoutSeconds:
                      default: 30
                      description: TimeoutSeconds bounds an individual probe attempt.
                      format: int32
                      minimum: 1
                      type: integer
                    type:
                      default: Pod
                      description: Type selects the probe implementation.
                      enum:
                      - HTTP
                      - Pod
                      - Cmd
                      - Kubernetes
                      type: string
                    url:
                      description: URL is the HTTP URL to probe (only for type HTTP).
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              policyRef:
                description: PolicyRef optionally links the drill to a ResiliencePolicy.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                required:
                - name
                type: object
              schedule:
                description: Schedule is an optional cron expression for periodic
                  drills.
                type: string
              source:
                description: Source describes the backup to restore (RestoreVerification
                  only).
                properties:
                  apiGroup:
                    default: velero.io
                    description: APIGroup of the backup object. Defaults to "velero.io".
                    type: string
                  kind:
                    default: Backup
                    description: Kind of the backup object. Defaults to "Backup".
                    type: string
                  name:
                    description: Name of the backup object (for example, a Velero
                      Backup).
                    type: string
                  namespace:
                    description: Namespace of the backup object.
                    type: string
                required:
                - name
                - namespace
                type: object
              timeoutSeconds:
                default: 1800
                description: TimeoutSeconds bounds the entire drill.
                format: int32
                minimum: 60
                type: integer
              type:
                description: Type is the kind of drill.
                enum:
                - RestoreVerification
                - FailoverDrill
                type: string
              verificationNamespace:
                description: |-
                  VerificationNamespace is the namespace where verification artefacts are created.
                  When empty, the controller derives a unique name from the drill metadata.
                type: string
            required:
            - type
            type: object
          status:
            description: RecoveryDrillStatus defines the observed state of RecoveryDrill.
            properties:
              completionTime:
                description: CompletionTime is when the drill reached a terminal phase.
                format: date-time
                type: string
              conditions:
                description: Conditions track the lifecycle of the drill.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              durationSeconds:
                description: DurationSeconds is the wall clock duration of the drill.
                format: int32
                type: integer
              evidence:
                description: Evidence is the ordered list of audit records produced
                  by the drill.
                items:
                  description: |-
                    EvidenceRecord is an audit-friendly artefact produced by a drill. Records
                    are append-only: once a step has produced an EvidenceRecord, the controller
                    never modifies or removes it.
                  properties:
                    message:
                      description: Message is a human readable summary.
                      type: string
                    result:
                      description: Result captures the outcome (Pass, Fail, Skip).
                      type: string
                    step:
                      description: Step is the drill step that produced the evidence.
                      type: string
                    time:
                      description: Time the evidence was produced.
                      format: date-time
                      type: string
                  required:
                  - result
                  - step
                  - time
                  type: object
                type: array
              message:
                description: Message is a human readable summary of the most recent
                  state transition.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the high-level state of the drill.
                enum:
                - Pending
                - Running
                - Succeeded
                - Failed
                type: string
              startTime:
                description: StartTime is when the drill began executing.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
