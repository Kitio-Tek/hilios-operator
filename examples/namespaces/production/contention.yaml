apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: production-contention
  namespace: production
spec:
  targetSelector:
    matchLabels:
      env: production
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
