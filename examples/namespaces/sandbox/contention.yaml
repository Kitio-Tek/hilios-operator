apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: sandbox-contention
  namespace: sandbox
spec:
  targetSelector:
    matchLabels:
      env: sandbox
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
