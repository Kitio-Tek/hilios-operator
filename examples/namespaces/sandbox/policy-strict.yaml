apiVersion: resilience.hilios.io/v1alpha1
kind: ResiliencePolicy
metadata:
  name: sandbox-policy-strict
  namespace: sandbox
spec:
  targetSelector:
    matchLabels:
      env: sandbox
      tier: critical
      hilios.io/enabled: "true"
  verifications:
    - kind: RestoreVerification
      intervalSeconds: 7200
      freshnessSeconds: 21600
    - kind: FailoverDrill
      intervalSeconds: 86400
      freshnessSeconds: 172800
  mitigations:
    - ApplyTopologySpread
    - ScaleSafely
  slo:
    recoveryTimeSeconds: 300
    maxReplicaSkew: 0
