apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: ai-contention
  namespace: ai
spec:
  targetSelector:
    matchLabels:
      env: ai
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
