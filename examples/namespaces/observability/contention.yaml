apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: observability-contention
  namespace: observability
spec:
  targetSelector:
    matchLabels:
      env: observability
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
