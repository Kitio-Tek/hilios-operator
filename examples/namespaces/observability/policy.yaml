apiVersion: resilience.hilios.io/v1alpha1
kind: ResiliencePolicy
metadata:
  name: observability-policy
  namespace: observability
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      env: observability
  verifications:
    - kind: RestoreVerification
      intervalSeconds: 14400
      freshnessSeconds: 86400
