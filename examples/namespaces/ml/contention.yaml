apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: ml-contention
  namespace: ml
spec:
  targetSelector:
    matchLabels:
      env: ml
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
