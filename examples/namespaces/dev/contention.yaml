apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: dev-contention
  namespace: dev
spec:
  targetSelector:
    matchLabels:
      env: dev
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
