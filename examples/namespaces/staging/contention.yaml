apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: staging-contention
  namespace: staging
spec:
  targetSelector:
    matchLabels:
      env: staging
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
