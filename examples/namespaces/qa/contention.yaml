apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: qa-contention
  namespace: qa
spec:
  targetSelector:
    matchLabels:
      env: qa
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
