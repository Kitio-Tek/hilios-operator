apiVersion: resilience.hilios.io/v1alpha1
kind: RecoveryDrill
metadata:
  name: redis-restore-template
  namespace: default
  annotations:
    hilios.io/catalog: redis
spec:
  type: RestoreVerification
  source:
    apiGroup: velero.io
    kind: Backup
    name: REPLACE_WITH_BACKUP_NAME
    namespace: velero
  verificationNamespace: redis-restore-verify
  cleanup: true
  timeoutSeconds: 1200
  healthChecks:
    - name: master-readiness
      type: HTTP
      url: http://redis-master.redis-restore-verify.svc:9121/metrics
      expectedStatusCode: 200
