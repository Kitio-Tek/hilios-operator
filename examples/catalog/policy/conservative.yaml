apiVersion: resilience.hilios.io/v1alpha1
kind: ResiliencePolicy
metadata:
  name: conservative
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
  verifications:
    - kind: RestoreVerification
      intervalSeconds: 86400
      freshnessSeconds: 604800
  slo:
    recoveryTimeSeconds: 1800
    maxReplicaSkew: 2
