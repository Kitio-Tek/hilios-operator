apiVersion: resilience.hilios.io/v1alpha1
kind: RebalanceCheck
metadata:
  name: digitalocean-zone-spread
  namespace: default
  annotations:
    hilios.io/cloud: digitalocean
spec:
  targetSelector:
    matchLabels:
      cloud: digitalocean
  topologyKey: topology.kubernetes.io/zone
  maxSkew: 1
  dryRun: true
