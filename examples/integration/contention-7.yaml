apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-7
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-7
  windowMinutes: 12
  thresholds:
    cpuStealPercent: 12
    memoryPressureEvents: 8
    throttlingPercent: 12
  recommendOnly: true
