apiVersion: resilience.hilios.io/v1alpha1
kind: ResiliencePolicy
metadata:
  name: sample-24
  namespace: default
  labels:
    hilios.io/sample: "24"
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      sample: "24"
  verifications:
    - kind: RestoreVerification
      intervalSeconds: 14400
      freshnessSeconds: 86400
  slo:
    recoveryTimeSeconds: 1440
    maxReplicaSkew: 0
