apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-21
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-21
  windowMinutes: 26
  thresholds:
    cpuStealPercent: 6
    memoryPressureEvents: 2
    throttlingPercent: 26
  recommendOnly: true
