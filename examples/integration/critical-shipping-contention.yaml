apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: critical-shipping-contention
  namespace: default
spec:
  targetSelector:
    matchLabels:
      app: shipping
      tier: critical
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
