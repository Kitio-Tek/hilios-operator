apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-12
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-12
  windowMinutes: 17
  thresholds:
    cpuStealPercent: 17
    memoryPressureEvents: 3
    throttlingPercent: 17
  recommendOnly: true
