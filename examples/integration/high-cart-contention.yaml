apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: high-cart-contention
  namespace: default
spec:
  targetSelector:
    matchLabels:
      app: cart
      tier: high
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 10
    memoryPressureEvents: 5
    throttlingPercent: 15
  recommendOnly: true
