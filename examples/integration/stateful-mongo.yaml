# Mongo ReplicaSet enrolled in HILIOS.
# Apply this StatefulSet shell to opt the workload into HILIOS via the
# hilios.io/enabled label. The container spec is intentionally minimal; replace
# it with your real workload definition.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: default
  labels:
    hilios.io/enabled: "true"
    app: mongo
spec:
  serviceName: mongo
  replicas: 3
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
        hilios.io/enabled: "true"
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 5432
