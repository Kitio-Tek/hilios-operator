apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-16
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-16
  windowMinutes: 21
  thresholds:
    cpuStealPercent: 21
    memoryPressureEvents: 7
    throttlingPercent: 21
  recommendOnly: true
