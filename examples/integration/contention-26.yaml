apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-26
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-26
  windowMinutes: 31
  thresholds:
    cpuStealPercent: 11
    memoryPressureEvents: 7
    throttlingPercent: 6
  recommendOnly: true
