apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-30
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-30
  windowMinutes: 5
  thresholds:
    cpuStealPercent: 15
    memoryPressureEvents: 1
    throttlingPercent: 10
  recommendOnly: true
