apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-1
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-1
  windowMinutes: 6
  thresholds:
    cpuStealPercent: 6
    memoryPressureEvents: 2
    throttlingPercent: 6
  recommendOnly: true
