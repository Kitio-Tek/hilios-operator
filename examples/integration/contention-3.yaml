apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-3
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-3
  windowMinutes: 8
  thresholds:
    cpuStealPercent: 8
    memoryPressureEvents: 4
    throttlingPercent: 8
  recommendOnly: true
