# MySQL StatefulSet enrolled in HILIOS.
# Apply this StatefulSet shell to opt the workload into HILIOS via the
# hilios.io/enabled label. The container spec is intentionally minimal; replace
# it with your real workload definition.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: default
  labels:
    hilios.io/enabled: "true"
    app: mysql
spec:
  serviceName: mysql
  replicas: 3
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        hilios.io/enabled: "true"
    spec:
      containers:
        - name: mysql
          image: mysql:latest
          ports:
            - containerPort: 5432
