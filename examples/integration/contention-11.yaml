apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-11
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-11
  windowMinutes: 16
  thresholds:
    cpuStealPercent: 16
    memoryPressureEvents: 2
    throttlingPercent: 16
  recommendOnly: true
