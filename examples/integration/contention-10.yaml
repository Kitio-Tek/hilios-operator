apiVersion: resilience.hilios.io/v1alpha1
kind: ContentionReport
metadata:
  name: contention-10
  namespace: default
spec:
  targetSelector:
    matchLabels:
      hilios.io/enabled: "true"
      tier: t-10
  windowMinutes: 15
  thresholds:
    cpuStealPercent: 15
    memoryPressureEvents: 1
    throttlingPercent: 15
  recommendOnly: true
