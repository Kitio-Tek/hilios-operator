apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: contention-report
spec:
  description: |
    Creates a ContentionReport for an empty target selector and asserts that
    the controller marks it Observed=False without mitigation. Exercises the
    no-pod evaluator branch and the RecommendOnly default. Coverage that is
    not in the KUTTL suite today.
  steps:
    - name: create-report
      try:
        - apply:
            resource:
              apiVersion: resilience.hilios.io/v1alpha1
              kind: ContentionReport
              metadata:
                name: example-report
              spec:
                targetSelector:
                  matchLabels:
                    app: nonexistent
                windowMinutes: 15
                recommendOnly: true
        - assert:
            resource:
              apiVersion: resilience.hilios.io/v1alpha1
              kind: ContentionReport
              metadata:
                name: example-report
              spec:
                recommendOnly: true
                (windowMinutes >= `1`): true
              status:
                (conditions[?type == 'Observed'] | [0].status): "False"
                (conditions[?type == 'Mitigated'] | [0].status): "False"
      cleanup:
        - delete:
            ref:
              apiVersion: resilience.hilios.io/v1alpha1
              kind: ContentionReport
              name: example-report
