run:
  timeout: 5m
  allow-parallel-runners: true

issues:
  exclude-use-default: false
  max-same-issues: 0
  exclude-rules:
    - path: "api/.*"
      linters:
        - lll
    - path: "internal/.*"
      linters:
        - dupl
        - lll
    # kubebuilder marker comments use //+ without a trailing space; that is
    # intentional and must not be flagged by comment-spacings.
    - source: "^//\\+"
      linters:
        - revive
    - path: "_test\\.go"
      linters:
        - dupl
        - goconst
        - lll

linters:
  disable-all: true
  enable:
    - errcheck
    - goconst
    - gocyclo
    - godot
    - gofmt
    - goimports
    - gosimple
    - govet
    - ineffassign
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - typecheck
    - unconvert
    - unparam
    - unused
    - whitespace

linters-settings:
  revive:
    rules:
      - name: comment-spacings
  godot:
    scope: declarations
    period: true
  gocyclo:
    min-complexity: 25
