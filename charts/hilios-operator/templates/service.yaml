apiVersion: v1
kind: Service
metadata:
  name: {{ include "hilios.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hilios.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metricsPort }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "hilios.selectorLabels" . | nindent 4 }}
