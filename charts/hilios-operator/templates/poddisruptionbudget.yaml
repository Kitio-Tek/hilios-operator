{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) -}}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hilios.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hilios.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hilios.selectorLabels" . | nindent 6 }}
{{- end }}
