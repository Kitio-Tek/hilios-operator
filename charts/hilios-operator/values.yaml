# Default values for the HILIOS operator chart.

# replicaCount controls the number of operator manager replicas.
replicaCount: 1

image:
  repository: ghcr.io/kitio-tek/hilios-operator
  pullPolicy: IfNotPresent
  # tag is overridden in CI by the release pipeline. Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# leaderElection enables leader election so only one manager is active at a time.
leaderElection:
  enabled: true

# metricsPort is the port on which the operator exposes Prometheus metrics.
metricsPort: 8443

# healthProbePort is the port used for liveness and readiness probes.
healthProbePort: 8081

nodeSelector: {}
tolerations: []
affinity: {}

# crds controls whether the Helm chart installs CRDs.
crds:
  install: true
  keep: true

# rbac controls whether RBAC resources are created.
rbac:
  create: true

# serviceMonitor controls whether a Prometheus Operator ServiceMonitor is created.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

# extraArgs are passed verbatim to the manager container.
extraArgs: []
