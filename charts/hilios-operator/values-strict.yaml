# A stricter set of values used for production-shaped deployments.
# Use with: helm install hilios charts/hilios-operator -f values-strict.yaml

replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

leaderElection:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

networkPolicy:
  enabled: true

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hilios-operator
          topologyKey: topology.kubernetes.io/zone

podLabels:
  hilios.io/control-plane: "true"
